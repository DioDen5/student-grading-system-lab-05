[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "student-grading-io"
version = "0.5.0"
description = "Reliable student grading import/export — laboratory work 5, variant 7"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Denys Zastavnyi"}]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["mypy>=1.11", "pytest>=8.0", "pytest-cov>=5.0", "types-PyYAML>=6.0"]

[project.scripts]
student-grading-io = "student_grading_io.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.coverage.run]
branch = true
source = ["student_grading_io"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
warn_unreachable = true
show_error_codes = true
pretty = true

